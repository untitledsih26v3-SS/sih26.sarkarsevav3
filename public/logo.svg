<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Composite Civic Emblem: Government of Maharashtra & India -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
  </defs>

  <!-- Outer Ring with Tricolor Border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  
  <g clip-path="url(#circleClip)">
    <!-- Tricolor Flag Bands in Upper/Lower Header Arc -->
    <rect x="0" y="0" width="100" height="28" fill="#FF9933" />
    <rect x="0" y="28" width="100" height="44" fill="#FFFFFF" />
    <rect x="0" y="72" width="100" height="28" fill="#138808" />

    <!-- Central Inner Emblem Circle with Maharashtra Seal Ring -->
    <circle cx="50" cy="50" r="26" fill="#ffffff" stroke="#000080" stroke-width="2" />

    <!-- 24 Spokes of Ashoka Chakra -->
    <g transform="translate(50, 50)" stroke="#000080" stroke-width="1" opacity="0.4">
      <line x1="0" y1="-26" x2="0" y2="26" />
      <line x1="-26" y1="0" x2="26" y2="0" />
      <line x1="-18" y1="-18" x2="18" y2="18" />
      <line x1="-18" y1="18" x2="18" y2="-18" />
    </g>

    <!-- Traditional Samai / Lion Crest in Center -->
    <!-- Lion Capital Profile Silhouette -->
    <g transform="translate(50, 50) scale(0.38)" fill="#0f172a">
      <!-- Central Pillar & Flame -->
      <path d="M 0 -40 C -10 -25, -6 -10, 0 -10 C 6 -10, 10 -25, 0 -40 Z" fill="#b91c1c" />
      <path d="M -15 -25 L 15 -25 L 8 20 L -8 20 Z" />
      <ellipse cx="0" cy="22" rx="20" ry="6" fill="#0f172a" />
      <!-- Base Base -->
      <rect x="-24" y="26" width="48" height="8" rx="3" />
      <!-- Top Flame Core -->
      <circle cx="0" cy="-45" r="3" fill="#f59e0b" />
    </g>
  </g>

  <!-- Gold/Navy Trim Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#000080" stroke-width="2.5" />
</svg>
