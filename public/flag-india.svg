<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Indian National Flag (Tiranga) - 3:2 aspect ratio -->
  <!-- Top Band: India Saffron (Kesari) -->
  <rect width="900" height="200" fill="#FF9933" />
  <!-- Middle Band: White -->
  <rect y="200" width="900" height="200" fill="#FFFFFF" />
  <!-- Bottom Band: India Green -->
  <rect y="400" width="900" height="200" fill="#138808" />

  <!-- Ashoka Chakra (24 Spokes, Navy Blue) -->
  <g transform="translate(450, 300)">
    <!-- Outer Ring -->
    <circle r="80" fill="none" stroke="#000080" stroke-width="7" />
    <!-- Inner Hub Ring -->
    <circle r="16" fill="#000080" />
    <circle r="7" fill="#FFFFFF" />

    <!-- 24 Spokes (15 degrees each) -->
    <g stroke="#000080" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-16" x2="0" y2="-80" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(15)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(30)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(45)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(60)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(75)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(90)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(105)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(120)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(135)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(150)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(165)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(180)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(195)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(210)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(225)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(240)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(255)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(270)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(285)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(300)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(315)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(330)" />
      <line x1="0" y1="-16" x2="0" y2="-80" transform="rotate(345)" />
    </g>

    <!-- 24 Small Outer Dots -->
    <g fill="#000080">
      <circle cx="0" cy="-73" r="3" />
      <circle cx="0" cy="-73" r="3" transform="rotate(15)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(30)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(45)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(60)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(75)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(90)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(105)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(120)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(135)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(150)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(165)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(180)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(195)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(210)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(225)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(240)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(255)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(270)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(285)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(300)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(315)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(330)" />
      <circle cx="0" cy="-73" r="3" transform="rotate(345)" />
    </g>
  </g>
</svg>
