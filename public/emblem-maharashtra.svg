<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background transparent -->
  <rect width="500" height="500" fill="none" />

  <!-- State Emblem of India with Government of Maharashtra -->
  <g id="lion-capital" transform="translate(250, 160)" fill="#1e293b" stroke="#1e293b">
    <!-- Center Lion Face & Mane -->
    <path d="M-35 -110 C-45 -125, -20 -140, 0 -140 C20 -140, 45 -125, 35 -110 C50 -95, 55 -70, 40 -50 C48 -35, 35 -15, 25 0 L-25 0 C-35 -15, -48 -35, -40 -50 C-55 -70, -50 -95, -35 -110 Z" fill="#0f172a" stroke="none" />
    
    <!-- Central Lion Head Details -->
    <ellipse cx="0" cy="-90" rx="20" ry="24" fill="#ffffff" opacity="0.15" />
    <circle cx="-10" cy="-95" r="4" fill="#ffffff" />
    <circle cx="10" cy="-95" r="4" fill="#ffffff" />
    <circle cx="-10" cy="-95" r="2" fill="#0f172a" />
    <circle cx="10" cy="-95" r="2" fill="#0f172a" />
    <!-- Muzzle & Whiskers -->
    <path d="M-6 -82 C-3 -85, 3 -85, 6 -82 C8 -78, -8 -78, -6 -82" stroke="#ffffff" stroke-width="2" fill="none" />
    <path d="M0 -82 L0 -72" stroke="#ffffff" stroke-width="2" />
    <path d="M-10 -72 Q0 -66 10 -72" stroke="#ffffff" stroke-width="2.5" fill="none" />

    <!-- Left Lion (Profile) -->
    <path d="M-25 -95 C-55 -115, -85 -90, -80 -60 C-95 -45, -80 -20, -60 -10 L-25 0 Z" fill="#1e293b" opacity="0.95" />
    <circle cx="-62" cy="-62" r="3.5" fill="#ffffff" />
    <circle cx="-62" cy="-62" r="1.8" fill="#0f172a" />

    <!-- Right Lion (Profile) -->
    <path d="M25 -95 C55 -115, 85 -90, 80 -60 C95 -45, 80 -20, 60 -10 L25 0 Z" fill="#1e293b" opacity="0.95" />
    <circle cx="62" cy="-62" r="3.5" fill="#ffffff" />
    <circle cx="62" cy="-62" r="1.8" fill="#0f172a" />

    <!-- Lion Manes Fur Texture -->
    <g stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.4">
      <path d="M-15 -60 Q-25 -45 -10 -30" />
      <path d="M15 -60 Q25 -45 10 -30" />
      <path d="M-5 -50 Q-15 -35 0 -20" />
      <path d="M5 -50 Q15 -35 0 -20" />
      <path d="M-30 -40 Q-45 -25 -25 -10" />
      <path d="M30 -40 Q45 -25 25 -10" />
    </g>

    <!-- Paws and Front Torso -->
    <rect x="-42" y="0" width="18" height="55" rx="6" fill="#0f172a" />
    <rect x="24" y="0" width="18" height="55" rx="6" fill="#0f172a" />
    <rect x="-14" y="5" width="28" height="50" rx="4" fill="#1e293b" />

    <!-- Claws -->
    <g fill="#ffffff" opacity="0.5">
      <circle cx="-38" cy="50" r="2" />
      <circle cx="-33" cy="52" r="2" />
      <circle cx="-28" cy="50" r="2" />
      <circle cx="28" cy="50" r="2" />
      <circle cx="33" cy="52" r="2" />
      <circle cx="38" cy="50" r="2" />
    </g>

    <!-- Abacus Base Platform -->
    <rect x="-95" y="55" width="190" height="42" rx="14" fill="#0f172a" />
    <rect x="-90" y="58" width="180" height="36" rx="12" fill="#334155" />

    <!-- Center Ashoka Chakra in Base -->
    <g transform="translate(0, 76)">
      <circle r="15" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <circle r="3.5" fill="#ffffff" />
      <!-- Spokes -->
      <g stroke="#ffffff" stroke-width="1.2">
        <line x1="0" y1="-14" x2="0" y2="14" />
        <line x1="-14" y1="0" x2="14" y2="0" />
        <line x1="-10" y1="-10" x2="10" y2="10" />
        <line x1="-10" y1="10" x2="10" y2="-10" />
        <line x1="-13" y1="-5" x2="13" y2="5" />
        <line x1="-5" y1="-13" x2="5" y2="13" />
        <line x1="-13" y1="5" x2="13" y2="-5" />
        <line x1="-5" y1="13" x2="5" y2="-13" />
      </g>
    </g>

    <!-- Galloping Horse on Left of Base -->
    <g transform="translate(-50, 76) scale(0.65)" fill="#ffffff" opacity="0.85">
      <path d="M-15 5 C-20 -5, -10 -15, 0 -12 C10 -10, 15 -5, 20 0 L15 10 L5 8 L-5 12 Z" />
    </g>

    <!-- Bull on Right of Base -->
    <g transform="translate(50, 76) scale(0.65)" fill="#ffffff" opacity="0.85">
      <path d="M15 5 C20 -5, 10 -15, 0 -12 C-10 -10, -15 -5, -20 0 L-15 10 L-5 8 L5 12 Z" />
    </g>

    <!-- Bell Capital / Lotus Petals Platform below abacus -->
    <path d="M-80 97 C-40 106, 40 106, 80 97 L65 110 C30 114, -30 114, -65 110 Z" fill="#0f172a" />
  </g>

  <!-- Motto: "सत्यमेव जयते" (Truth Alone Triumphs) in Devanagari script -->
  <text x="250" y="325" font-family="'Noto Sans Devanagari', 'Plus Jakarta Sans', serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    सत्यमेव जयते
  </text>

  <!-- Title: "GOVERNMENT OF MAHARASHTRA" -->
  <text x="250" y="375" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2.5">
    GOVERNMENT OF
  </text>
  <text x="250" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2.5">
    MAHARASHTRA
  </text>
</svg>
