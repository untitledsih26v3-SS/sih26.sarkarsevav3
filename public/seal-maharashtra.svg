<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- State Seal of Maharashtra (Rajmudra & Samai Lamp) -->
  <defs>
    <!-- Circular Path for Inscription -->
    <path id="topTextArc" d="M 120 300 A 180 180 0 1 1 480 300" fill="none" />
    <path id="bottomTextArc" d="M 480 300 A 180 180 0 0 1 120 300" fill="none" />
  </defs>

  <!-- Transparent Background -->
  <rect width="600" height="600" fill="none" />

  <!-- Outer Lotus Petal Border Ring -->
  <g transform="translate(300, 260)">
    <!-- 24 Stylized Lotus Petals Garland -->
    <g fill="none" stroke="#000000" stroke-width="3.5">
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(15)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(30)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(45)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(60)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(75)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(90)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(105)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(120)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(135)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(150)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(165)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(180)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(195)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(210)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(225)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(240)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(255)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(270)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(285)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(300)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(315)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(330)" />
      <path d="M 0 -245 C -15 -230, -10 -210, 0 -200 C 10 -210, 15 -230, 0 -245 Z" fill="#ffffff" transform="rotate(345)" />
    </g>

    <!-- Double Concentric Framing Rings -->
    <circle r="202" fill="none" stroke="#000000" stroke-width="4.5" />
    <circle r="150" fill="none" stroke="#000000" stroke-width="3" />

    <!-- Circular Sanskrit Inscription:
         प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्ववंदिता महाराष्ट्रस्य राज्यस्य मुद्रा भद्राय राजते -->
    <!-- Top Arc Text -->
    <text font-family="'Noto Sans Devanagari', 'Mangal', 'Plus Jakarta Sans', serif" font-size="20" font-weight="900" fill="#000000" letter-spacing="3.5">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्ववंदिता
      </textPath>
    </text>

    <!-- Bottom Arc Text -->
    <text font-family="'Noto Sans Devanagari', 'Mangal', 'Plus Jakarta Sans', serif" font-size="20" font-weight="900" fill="#000000" letter-spacing="3.5">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        महाराष्ट्रस्य राज्यस्य मुद्रा भद्राय राजते
      </textPath>
    </text>

    <!-- Central Traditional Samai (Diya Lamp) -->
    <g transform="translate(0, 5)">
      <!-- Samai Base Pedestal with ornate tiers -->
      <ellipse cx="0" cy="90" rx="80" ry="16" fill="none" stroke="#000000" stroke-width="4" />
      <ellipse cx="0" cy="80" rx="65" ry="12" fill="none" stroke="#000000" stroke-width="3.5" />
      
      <!-- Stem / Pillar -->
      <path d="M -15 80 L -8 30 L -18 20 L -6 -10 L -12 -15 L 0 -45 L 12 -15 L 6 -10 L 18 20 L 8 30 L 15 80 Z" fill="#000000" />

      <!-- Center Lamp Oil Bowl (Pradeep / Katori) -->
      <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#000000" stroke-width="4.5" />
      <ellipse cx="0" cy="-6" rx="75" ry="18" fill="none" stroke="#000000" stroke-width="3" />

      <!-- Oil Lamp Wicks and Glowing Flames radiating outward -->
      <!-- Center Flame -->
      <path d="M 0 -85 C -14 -60, -10 -40, 0 -40 C 10 -40, 14 -60, 0 -85 Z" fill="#000000" />
      <!-- Left Flame 1 -->
      <path d="M -40 -65 C -48 -45, -35 -30, -28 -30 C -20 -30, -32 -48, -40 -65 Z" fill="#000000" />
      <!-- Left Flame 2 -->
      <path d="M -75 -40 C -82 -25, -68 -15, -60 -15 C -52 -15, -65 -28, -75 -40 Z" fill="#000000" />
      <!-- Right Flame 1 -->
      <path d="M 40 -65 C 48 -45, 35 -30, 28 -30 C 20 -30, 32 -48, 40 -65 Z" fill="#000000" />
      <!-- Right Flame 2 -->
      <path d="M 75 -40 C 82 -25, 68 -15, 60 -15 C 52 -15, 65 -28, 75 -40 Z" fill="#000000" />

      <!-- Decorative Filigree atop Central Pillar -->
      <circle cx="0" cy="-94" r="5" fill="#000000" />
    </g>
  </g>

  <!-- Typography below Seal: "Government of Maharashtra" -->
  <text x="300" y="540" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">
    Government of
  </text>
  <text x="300" y="580" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">
    Maharashtra
  </text>
</svg>
